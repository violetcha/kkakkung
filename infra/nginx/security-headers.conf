# S15P21C204-303. 앱 응답에 붙는 보안 헤더. web-proxy 이미지 안 /etc/nginx/snippets/ 에 들어간다.
#
# 호스트 nginx 는 proxy_pass 로 받은 upstream 헤더를 그대로 흘려보내므로, 여기서 한 번만 붙이면
# 인터넷까지 간다. HSTS 만 TLS 를 끝내는 호스트가 붙인다(컨테이너는 평문 HTTP 다).
#
# nginx 규칙 주의: 어떤 location 에 자기 add_header 가 하나라도 있으면 바깥 level 의 add_header
# 를 **전부 잃는다.** 그래서 Cache-Control 을 따로 붙이는 location 마다 이 파일을 다시 include
# 한다. 빠뜨리면 그 경로만 조용히 헤더 없이 나간다.

# CSP 는 실제 프로덕션 빌드를 브라우저로 돌려 정한 값이다(S15P21C204-303). 근거:
#   script-src 'wasm-unsafe-eval' — MediaPipe 가 .wasm 을 컴파일한다. 'unsafe-eval' 은 필요 없다.
#     Zod 4 의 JIT 가 new Function 을 쓰는데, 웹 진입점에서 jitless 로 끈다.
#   worker-src 'self'   — 비전 Worker 는 같은 출처의 모듈 파일이다. blob: 워커는 쓰지 않는다.
#   style-src 'self'    — React 는 CSSOM 으로 스타일을 넣어 'unsafe-inline' 이 필요 없다.
#   img-src data:       — 캔버스·아이콘이 data URL 을 쓴다.
#   media-src blob:     — 원격 트랙은 srcObject 라 CSP 밖이지만, blob: 재생 경로를 남겨 둔다.
#   connect-src livekit — 미디어 서버 주소는 발급 때 정해진다. 프로젝트를 갈아끼워도 되도록
#                         호스트를 고정하지 않고 livekit.cloud 하위로 허용한다.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://*.livekit.cloud wss://*.livekit.cloud" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
# 카메라·마이크는 이 출처에서만. 나머지 기능은 아무도 못 쓴다.
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
