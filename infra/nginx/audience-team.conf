# S15P21C204-290. 공개 대상 = team. host.conf 의 `location /` 안에서 include 된다.
#
# GitLab 로그인을 통과하고 프로젝트 S15P21C204 멤버인 요청만 앱으로 보낸다. WebSocket
# 핸드셰이크도 쿠키를 들고 오므로 같은 검사를 지난다. 통과한 신원은 호출자가 보낸 값을
# 덮어쓴 뒤 넘긴다(빈 결과도 덮어쓴다). 백엔드는 이 신원을 gitlab-sso 모드에서만 받는다.
#
# 설치: sudo install -m 644 infra/nginx/audience-team.conf /etc/nginx/snippets/kkakkung-audience.conf
auth_request /oauth2/auth;
error_page 401 = @sso_signin;
auth_request_set $sso_user $upstream_http_x_auth_request_user;
# 갱신된 SSO 쿠키를 auth 서브요청에서 받아 브라우저로 돌려준다. 이 두 줄이 없으면
# 쿠키가 만료될 때 팀원이 로그아웃된다. 배포 호스트에 먼저 들어가 있던 것을 옮겨 왔다.
auth_request_set $sso_refresh_cookie $upstream_http_set_cookie;
add_header Set-Cookie $sso_refresh_cookie always;
proxy_set_header X-SSO-User $sso_user;
# `/demo` receives a separate, freshly asserted identity. No ordinary game request is admin.
proxy_set_header X-Demo-Admin "";
