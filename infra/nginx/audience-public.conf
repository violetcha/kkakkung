# S15P21C204-290. 공개 대상 = public. host.conf 의 `location /` 안에서 include 된다.
#
# 누구나 앱에 닿는다. 로그인 검사가 없으므로 호출자가 X-SSO-User 를 직접 붙여 보낼 수 있고,
# 그대로 넘기면 백엔드가 남의 신원으로 읽을 수 있다. 빈 값으로 덮어써서 지운다.
# 백엔드는 guest 모드에서 이 헤더를 쓰지 않지만, 모드를 되돌리는 도중에도 신뢰 경계가
# 뚫리지 않도록 가장자리에서 지운다.
#
# 설치: sudo install -m 644 infra/nginx/audience-public.conf /etc/nginx/snippets/kkakkung-audience.conf
proxy_set_header X-SSO-User "";
