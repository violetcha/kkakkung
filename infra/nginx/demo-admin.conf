# Included by `/demo`, `/showcase` and their administrator APIs in host.conf.
#
# The login gate admits every lab.ssafy.com account (S15P21C204-367), so this snippet only proves
# who is signed in. nginx overwrites X-Demo-Admin with the login email from oauth2-proxy, and the
# game server admits it only when that email is on the operator list (DEMO_ADMIN_EMAILS_FILE).
# A requester's own X-Demo-Admin value can never authorize a demo or showcase room.
auth_request /oauth2/auth;
error_page 401 = @sso_signin;
auth_request_set $demo_admin_email $upstream_http_x_auth_request_email;
auth_request_set $sso_refresh_cookie $upstream_http_set_cookie;
add_header Set-Cookie $sso_refresh_cookie always;
# This location has its own add_header above, so retain the TLS-only header that location / sets.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
proxy_set_header X-Demo-Admin $demo_admin_email;
# A public game deployment must not turn this administrator assertion into player identity.
proxy_set_header X-SSO-User "";
