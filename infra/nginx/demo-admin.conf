# Included only by the `/demo` page and `/api/demo-admin` endpoint in host.conf.
#
# The normal audience can be public, but this small operator surface always stays behind the
# existing GitLab project-member SSO. nginx obtains the identity from oauth2-proxy and overwrites
# the upstream header, so a requester's own X-Demo-Admin value can never authorize a demo room.
auth_request /oauth2/auth;
error_page 401 = @sso_signin;
auth_request_set $demo_admin_user $upstream_http_x_auth_request_user;
auth_request_set $sso_refresh_cookie $upstream_http_set_cookie;
add_header Set-Cookie $sso_refresh_cookie always;
# This location has its own add_header above, so retain the TLS-only header that location / sets.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
proxy_set_header X-Demo-Admin $demo_admin_user;
# A public game deployment must not turn this administrator assertion into player identity.
proxy_set_header X-SSO-User "";
