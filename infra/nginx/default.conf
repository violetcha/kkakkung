# web-proxy 컨테이너 안 nginx. 정적 파일 + /api, /matchmake, WebSocket → game-server.
# EC2 에서는 호스트 nginx(infra/nginx/host.conf)가 TLS 를 끝내고 여기(127.0.0.1:8080)로 넘깁니다.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # 뒤 서버가 실제 클라이언트 주소·프로토콜을 알 수 있게 (Express trust proxy 와 맞춤).
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  # webhook(raw body) 등 본문을 그대로 전달합니다.
  proxy_request_buffering off;

  location /api/ { proxy_pass http://game-server:2567; }
  location /health/ { proxy_pass http://game-server:2567; }
  location = /health { proxy_pass http://game-server:2567; }
  # 개발 profile 용 진단 라우트. 운영에서는 호스트 nginx 가 404 로 막고, 서버 인증은 B 가 담당.
  location ^~ /monitor { proxy_pass http://game-server:2567; }
  location ^~ /playground { proxy_pass http://game-server:2567; }
  location /matchmake/ { proxy_pass http://game-server:2567; }

  # Colyseus room WebSocket URL: /processId/roomId.
  location ~ ^/[^/]+/[^/]+$ {
    proxy_pass http://game-server:2567;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # 로비·결과 화면 대기 중에도 끊기지 않게. 죽은 연결은 2초 heartbeat 로 서버가 정리합니다.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Vite 산출물은 파일명에 해시가 있어 영구 캐시.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # MediaPipe wasm 은 경로에 버전(1.0.1)이 있어 영구 캐시.
  location ^~ /models/mediapipe/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # .task 모델은 파일명에 버전이 없어 ETag 로 재검증 (교체해도 즉시 반영).
  location ^~ /models/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }
  location / { try_files $uri $uri/ /index.html; }
}
