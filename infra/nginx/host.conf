# EC2 호스트 nginx 설정. 컨테이너 안의 infra/nginx/default.conf 와는 역할이 다릅니다.
#
#   호스트 nginx  : TLS 종단(certbot), /jenkins, /oauth2 (GitLab SSO), 그 외 전부 → SSO 통과 후 127.0.0.1:8080 (web-proxy 컨테이너)
#   컨테이너 nginx: 정적 파일 + /api, /matchmake, WebSocket → game-server
#
# 적용 (서버):
#   sudo cp infra/nginx/host.conf /etc/nginx/sites-available/kkakkung
#   sudo ln -sf /etc/nginx/sites-available/kkakkung /etc/nginx/sites-enabled/kkakkung
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name j15c204.p.ssafy.io;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name j15c204.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/j15c204.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15c204.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # ---------- Jenkins ----------
    location /jenkins {
        proxy_pass http://127.0.0.1:18080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_redirect http:// https://;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # ---------- 헬스 (SSO 없이 관찰 가능: Jenkins 배포 확인·업타임) ----------
    location /health/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- GitLab SSO (oauth2-proxy, 127.0.0.1:4180) ----------
    # 팀원 확인: lab.ssafy.com 로그인 + 프로젝트 S15P21C204 멤버만 통과. infra/compose.sso.yaml 이 프록시를 띄운다.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
    }
    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        proxy_set_header Content-Length    "";
        proxy_pass_request_body off;
    }
    location @sso_signin {
        return 302 /oauth2/start?rd=$scheme://$host$request_uri;
    }

    # ---------- 개발 도구 차단 ----------
    # 컨테이너 nginx 는 /monitor, /playground 를 game-server 로 넘깁니다 (개발 profile 용).
    # 인터넷에서는 막습니다. 나중에 basic auth 로 열 땐 여기를 바꿉니다.
    location ^~ /monitor    { return 404; }
    location ^~ /playground { return 404; }
    location = /api/dev-sessions { return 404; }

    # Provider-to-server only: LiveKit cannot complete interactive GitLab SSO.
    # The app checks the signed Authorization and original raw body before accepting events.
    location = /api/livekit/webhook {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # ---------- 앱 전체 → web-proxy 컨테이너 ----------
    # 정적 파일, /api, /matchmake, Colyseus WebSocket(/processId/roomId) 라우팅은
    # 컨테이너 안의 nginx(infra/nginx/default.conf)가 합니다. 여기선 그대로 넘기기만.
    location / {
        # 로그인 안 된 요청은 GitLab 로그인으로. WebSocket 핸드셰이크도 쿠키를 들고 오므로 같은 검사를 통과한다.
        auth_request /oauth2/auth;
        error_page 401 = @sso_signin;
        auth_request_set $sso_user $upstream_http_x_auth_request_user;
        # This replaces caller-supplied identity, including an empty result. The backend
        # may accept this identity only in explicit gitlab-sso mode on the private network.
        proxy_set_header X-SSO-User $sso_user;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket 업그레이드를 그대로 통과시킵니다. 일반 요청이면 Connection: close.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 게임 한 판 3분 + 대기. 기본 60초면 조용히 끊깁니다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
