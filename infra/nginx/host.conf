# EC2 호스트 nginx 설정. 컨테이너 안의 infra/nginx/default.conf 와는 역할이 다릅니다.
#
#   호스트 nginx  : TLS 종단(certbot), /jenkins, /oauth2 (GitLab SSO), 그 외 전부 → SSO 통과 후 127.0.0.1:8080 (web-proxy 컨테이너)
#   컨테이너 nginx: 정적 파일 + /api, /matchmake, WebSocket → game-server
#
# 적용 (서버): 공개 대상 조각을 먼저 깔아야 한다. 없으면 nginx 가 뜨지 않는다.
#   sudo install -m 644 infra/nginx/audience-team.conf /etc/nginx/snippets/kkakkung-audience.conf
#   sudo cp infra/nginx/host.conf /etc/nginx/sites-available/kkakkung
#   sudo ln -sf /etc/nginx/sites-available/kkakkung /etc/nginx/sites-enabled/kkakkung
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# 공개 대상 전환 (team ↔ public): 조각만 바꾼다. 절차는 docs/operations.md 3장.
#   sudo install -m 644 infra/nginx/audience-public.conf /etc/nginx/snippets/kkakkung-audience.conf
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name j15c204.p.ssafy.io;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name j15c204.p.ssafy.io;

    ssl_certificate     /etc/letsencrypt/live/j15c204.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15c204.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # ---------- Jenkins ----------
    location /jenkins {
        proxy_pass http://127.0.0.1:18080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        proxy_redirect http:// https://;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # ---------- 헬스 (SSO 없이 관찰 가능: Jenkins 배포 확인·업타임) ----------
    location /health/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- GitLab SSO (oauth2-proxy, 127.0.0.1:4180) ----------
    # 팀원 확인: lab.ssafy.com 로그인 + 프로젝트 S15P21C204 멤버만 통과. infra/compose.sso.yaml 이 프록시를 띄운다.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
    }
    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Uri   $request_uri;
        proxy_set_header Content-Length    "";
        proxy_pass_request_body off;
    }
    location @sso_signin {
        return 302 /oauth2/start?rd=$scheme://$host$request_uri;
    }

    # ---------- 개발 도구·운영 API 차단 (S15P21C204-290, 296) ----------
    # 컨테이너 nginx 는 /monitor, /playground 를 game-server 로 넘깁니다 (개발 profile 용).
    # 운영자는 호스트에서 loopback(127.0.0.1:8080)으로 부르므로 공개 경로로 열어 둘 이유가 없다.
    # team 이어도 SSO 만 지나면 Bearer 하나가 전부였다. public 에서는 그 Bearer 가 유일한 방어가 된다.
    #
    # 296. 접두 일치(`^~`)와 정확 일치(`=`)는 **대소문자를 가린다.** Express 는 가리지 않는다:
    # 기본 설정에서 `/API/OPERATIONS/status` 가 `/api/operations/status` 라우트로 들어간다(실측).
    # 그래서 대문자 변형과 슬래시 없는 bare 접두(`/api/operations`)가 이 차단을 지나쳐 앱까지
    # 닿았다. 대소문자를 무시하는 정규식으로 바꾼다. 정규식 location 은 접두 `location /` 보다
    # 먼저 평가되므로 여기서 끊긴다. 경계(`(/|$)`)를 두지 않아 접두 의미는 그대로 유지한다.
    location ~* ^/(monitor|playground) { return 404; }
    location ~* ^/api/dev-sessions     { return 404; }
    location ~* ^/api/operations       { return 404; }

    # Provider-to-server only: LiveKit cannot complete interactive GitLab SSO.
    # The app checks the signed Authorization and original raw body before accepting events.
    location = /api/livekit/webhook {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # ---------- 앱 전체 → web-proxy 컨테이너 ----------
    # 정적 파일, /api, /matchmake, Colyseus WebSocket(/processId/roomId) 라우팅은
    # 컨테이너 안의 nginx(infra/nginx/default.conf)가 합니다. 여기선 그대로 넘기기만.
    location / {
        # S15P21C204-290. 공개 대상(team/public)에 따라 달라지는 부분만 조각으로 뺀다.
        # team 이면 audience-team.conf(SSO 강제), public 이면 audience-public.conf.
        # 조각이 없으면 nginx 가 뜨지 않는다: 대상이 불분명한 채로 열리지 않게 하는 쪽이 낫다.
        include /etc/nginx/snippets/kkakkung-audience.conf;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket 업그레이드를 그대로 통과시킵니다. 일반 요청이면 Connection: close.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 게임 한 판 3분 + 대기. 기본 60초면 조용히 끊깁니다.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
