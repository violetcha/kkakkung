# GitLab SSO 게이트 (oauth2-proxy). 앱 배포(compose.yaml + compose.production.yaml)와 별개의 compose 프로젝트라
# develop 배포가 이 컨테이너를 건드리지 않습니다. 호스트 nginx 가 auth_request 로 127.0.0.1:4180 에 묻습니다.
#
#   docker compose -f infra/compose.sso.yaml up -d
#
# 비밀값(클라이언트 시크릿·쿠키 시크릿)은 /opt/kkakkung/sso.env 에만 둡니다 (토대: infra/sso.env.example).

name: kkakkung-sso

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    container_name: kkakkung-sso
    restart: unless-stopped
    ports:
      - '127.0.0.1:4180:4180'
    env_file:
      - /opt/kkakkung/sso.env
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_PROVIDER: gitlab
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://lab.ssafy.com
      OAUTH2_PROXY_REDIRECT_URL: https://j15c204.p.ssafy.io/oauth2/callback
      OAUTH2_PROXY_SCOPE: openid profile email
      # GitLab 로그인 후 운영자가 등록한 이메일만 허용한다.
      # 빈 값은 sso.env의 이전 프로젝트/전체 도메인 허용 설정도 덮어쓴다.
      OAUTH2_PROXY_GITLAB_PROJECTS: ''
      OAUTH2_PROXY_EMAIL_DOMAINS: ''
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/allowed-emails.txt
      # nginx auth_request 모드
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_REVERSE_PROXY: 'true'
      OAUTH2_PROXY_SET_XAUTHREQUEST: 'true'
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: 'true'
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_COOKIE_SECURE: 'true'
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      OAUTH2_PROXY_COOKIE_REFRESH: 1h
      OAUTH2_PROXY_WHITELIST_DOMAINS: j15c204.p.ssafy.io
    volumes:
      - type: bind
        source: /opt/kkakkung/sso-access
        target: /etc/oauth2-proxy
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }
