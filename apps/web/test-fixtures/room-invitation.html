<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Room invitation component test fixture</title>
  </head>
  <body>
    <button id="unmount">테스트 화면 닫기</button>
    <div id="fixture"></div>
    <script type="module">
      import { createElement } from 'react';
      import { createRoot } from 'react-dom/client';
      import { RoomInvitationControls } from '../src/features/room/RoomInvitationControls.tsx';

      // Vite development entry only; production builds include only index.html.
      if (!import.meta.env.DEV) throw new Error('TEST_FIXTURE_ONLY');
      const root = createRoot(document.getElementById('fixture'));
      root.render(
        createElement(RoomInvitationControls, {
          sessionToken: 'synthetic-component-session',
          roomCode: 'ABCDEF',
          teamOnly: true,
        }),
      );
      document.getElementById('unmount').addEventListener('click', () => root.unmount());
    </script>
  </body>
</html>
